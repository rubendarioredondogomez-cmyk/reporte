<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzxy0CmrLBWRT3Y9riK2n-PLbQZxXKwbu463JVUL08tfqQqWgE3qWWgOlN7-3Q3Gyq/exec";

    let chartDiarioInstance = null;
    let chartLlamadasInstance = null;

    function parseSafe(val) {
      if (!val) return 0;
      let str = val.toString().trim().replace('%', '');
      if (str.includes(',')) {
        str = str.replace(/\./g, '').replace(',', '.');
      } else {
        if ((str.match(/\./g) || []).length === 1 && !str.endsWith('.00')) {
          str = str.replace('.', '');
        }
      }
      return parseFloat(str) || 0;
    }

    async function cargarDatos() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        document.getElementById('fecha-corte').innerText = data.fecha || 'N/A';

        const prep = data.prepago || {};
        const susp = data.suspensiones || {};
        const diario = data.diario || { dias: [], recibidas: [], minutos: [] };

        // Poblar tabla
        const tbody = document.getElementById('tabla-body');
        tbody.innerHTML = `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-2.5 font-semibold text-blue-700">${prep.servicio || 'Prepago 4350/4351'}</td>
            <td class="p-2.5">${prep.pronostico || '-'}</td>
            <td class="p-2.5">${prep.recibidas || '-'}</td>
            <td class="p-2.5">${prep.minutos || '-'}</td>
            <td class="p-2.5">${prep.abandono || '-'}</td>
            <td class="p-2.5">${prep.ns || '-'}</td>
            <td class="p-2.5">${prep.tmo || '-'}</td>
            <td class="p-2.5">${prep.agentes || '-'}</td>
            <td class="p-2.5">${prep.adhesion || '-'}</td>
            <td class="p-2.5">${prep.productividad || '-'}</td>
            <td class="p-2.5">${prep.ocupacion || '-'}</td>
          </tr>
          <tr class="hover:bg-slate-50 transition">
            <td class="p-2.5 font-semibold text-amber-700">${susp.servicio || 'Suspensiones'}</td>
            <td class="p-2.5">${susp.pronostico || '-'}</td>
            <td class="p-2.5">${susp.recibidas || '-'}</td>
            <td class="p-2.5">${susp.minutos || '-'}</td>
            <td class="p-2.5">${susp.abandono || '-'}</td>
            <td class="p-2.5">${susp.ns || '-'}</td>
            <td class="p-2.5">${susp.tmo || '-'}</td>
            <td class="p-2.5">${susp.agentes || '-'}</td>
            <td class="p-2.5">${susp.adhesion || '-'}</td>
            <td class="p-2.5">${susp.productividad || '-'}</td>
            <td class="p-2.5">${susp.ocupacion || '-'}</td>
          </tr>
        `;

        // Tarjetas KPI
        const minP = parseSafe(prep.minutos);
        const minS = parseSafe(susp.minutos);
        const totalMinutos = minP + minS;
        const metaMinutos = 373500;
        const porcentajeAlcance = metaMinutos > 0 ? (totalMinutos / metaMinutos) * 100 : 0;

        document.getElementById('kpi-minutos-totales').innerText = totalMinutos.toLocaleString('es-ES');
        document.getElementById('kpi-alcance').innerText = porcentajeAlcance.toFixed(2) + '%';
        document.getElementById('kpi-tmo-prepago').innerText = (prep.tmo || '0');
        document.getElementById('kpi-tmo-susp').innerText = (susp.tmo || '0');
        document.getElementById('kpi-abandono-prepago').innerText = prep.abandono || '0%';
        document.getElementById('kpi-abandono-susp').innerText = susp.abandono || '0%';

        // Filtrado blindado anti-duplicados
        const diasValidos = [];
        const minutosValidos = [];
        const llamadasValidas = [];
        const diasVistos = new Set();

        const totalFilas = (diario.dias || []).length;
        for (let i = 0; i < totalFilas; i++) {
          let diaRaw = (diario.dias[i] || "").toString().trim();
          let minRaw = (diario.minutos[i] || "").toString().trim();
          let recRaw = (diario.recibidas[i] || "").toString().trim();

          if (!diaRaw || diaRaw.toLowerCase().includes("total") || diaRaw.toLowerCase().includes("fecha")) {
            continue;
          }

          let numMin = parseSafe(minRaw);
          let numRec = parseSafe(recRaw);

          let matchDia = diaRaw.match(/\d+/);
          if (!matchDia) continue;
          let diaNum = parseInt(matchDia[0], 10);

          if (diaNum >= 1 && diaNum <= 31 && !diasVistos.has(diaNum)) {
            if (numMin > 0 || numRec > 0) {
              diasVistos.add(diaNum);
              let diaStr = diaNum < 10 ? "0" + diaNum : diaNum.toString();

              diasValidos.push(diaStr);
              minutosValidos.push(minRaw);
              llamadasValidas.push(recRaw);
            }
          }
        }

        renderizarGraficos(diasValidos, minutosValidos, llamadasValidas);

      } catch (error) {
        console.error("Error al cargar los datos:", error);
      }
    }

    function renderizarGraficos(dias, minutos, llamadas) {
      const ctxDiario = document.getElementById('chartDiario').getContext('2d');
      if(chartDiarioInstance) chartDiarioInstance.destroy();

      const valoresMinutos = minutos.map(m => parseSafe(m));

      chartDiarioInstance = new Chart(ctxDiario, {
        type: 'bar',
        data: {
          labels: dias,
          datasets: [{
            label: 'Minutos Atendidos',
            data: valoresMinutos,
            backgroundColor: '#2563eb',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { 
              beginAtZero: true, 
              grid: { color: '#e2e8f0' }, 
              ticks: { 
                color: '#64748b', 
                font: { size: 10 },
                callback: function(value) { return value.toLocaleString('es-ES'); }
              } 
            },
            x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } }
          },
          plugins: { legend: { display: false } }
        }
      });

      const ctxLlamadas = document.getElementById('chartLlamadas').getContext('2d');
      if(chartLlamadasInstance) chartLlamadasInstance.destroy();

      const valoresLlamadas = llamadas.map(l => parseSafe(l));

      chartLlamadasInstance = new Chart(ctxLlamadas, {
        type: 'bar',
        data: {
          labels: dias,
          datasets: [{
            label: 'Llamadas Recibidas',
            data: valoresLlamadas,
            backgroundColor: '#059669',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { 
              beginAtZero: true, 
              grid: { color: '#e2e8f0' }, 
              ticks: { 
                color: '#64748b', 
                font: { size: 10 },
                callback: function(value) { return value.toLocaleString('es-ES'); }
              } 
            },
            x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    cargarDatos();
  </script>
